[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileconv"
version = "0.1.0"
description = "A local file converter prototype for Ubuntu"
readme = "README_step1.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "typer>=0.12",
    "img2pdf>=0.5",
    "PyMuPDF>=1.24",
    "pymupdf4llm>=0.0.17",
    "pikepdf>=9.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
fileconv = "fileconv.cli.main:app"
fileconv-menu = "fileconv.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
